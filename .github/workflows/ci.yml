name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: buildx-${{ runner.os }}-
      - name: Verify inside ROS container
        run: bash scripts/docker_verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: artifacts/
  nightly-headless:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Headless simulation gate
        run: |
          bash scripts/docker_verify.sh
          echo 'No Gazebo integration launch test implemented: failing closed.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-logs
          path: artifacts/
